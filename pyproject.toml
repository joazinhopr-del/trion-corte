[project]
name = "clipforge-ai"
version = "0.2.1"
description = "ClipForge AI - automatic long-form video clipping SaaS"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "python-multipart==0.0.20",
  "jinja2==3.1.6",
  "aiofiles==24.1.0",
  "pydantic-settings==2.9.1",
  "faster-whisper==1.1.1",
  "opencv-python-headless==4.11.0.86",
  "numpy==2.2.5",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "app.main:app"
